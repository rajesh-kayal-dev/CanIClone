name: Feature request
description: Suggest an improvement to CanIClone
title: "[Feature] "
body:
  - type: markdown
    attributes:
      value: |
        Please describe the user problem before proposing an implementation.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem would this solve, and for whom?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What behavior or capability should CanIClone provide?
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include other approaches you considered and why they are less suitable.

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add screenshots, examples, constraints, or related issues.
